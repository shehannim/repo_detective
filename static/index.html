<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>repo-detective</title>
  
  <!-- Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
    h1 { margin-bottom: 5px; }
    .subtitle { color: #666; margin-top: 0; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
    button { background: #0366d6; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005cc5; }
    button:disabled { background: #999; cursor: not-allowed; }
    .demo-buttons { margin-bottom: 15px; display: flex; gap: 10px; }
    .demo-btn { background: #f6f8fa; color: #0366d6; border: 1px solid #d1d5da; padding: 6px 12px; font-size: 13px; font-weight: normal; }
    .demo-btn:hover { background: #e1e4e8; color: #0366d6; }
    .panels { display: flex; gap: 20px; margin-top: 30px; }
    .panel { flex: 1; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .panel-header { background: #f6f8fa; padding: 10px 15px; border-bottom: 1px solid #ddd; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .panel-body { padding: 15px; background: #fafafa; flex: 1; overflow-y: auto; max-height: 500px; font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; }
    .step { margin-bottom: 8px; color: #555; }
    .step-time { color: #888; font-size: 11px; margin-right: 8px; display: inline-block; width: 55px; text-align: right; }
    .result-content { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
    .result-content h3 { margin-top: 0; display: inline-block; }
    .llm-exp { background: white; border: 1px solid #eee; padding: 15px; border-radius: 6px; }
    .llm-exp pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow-x: auto; }
    .llm-exp code { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; }
    .llm-exp p code { background: #f6f8fa; padding: 2px 4px; border-radius: 3px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: #0366d6; animation: spin 1s ease-in-out infinite; margin-left: 10px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .meta-badge { font-weight: normal; font-size: 12px; color: #666; background: #e1e4e8; padding: 2px 8px; border-radius: 12px; }
    .conf-badge { font-weight: bold; font-size: 12px; padding: 3px 8px; border-radius: 12px; color: white; float: right; margin-top: 2px; }
    .conf-high { background: #28a745; }
    .conf-med { background: #dbab09; }
    .conf-low { background: #cb2431; }
  </style>
</head>
<body>

  <h1>🔍 repo-detective</h1>
  <p class="subtitle">Ask natural-language questions about any public GitHub repository.</p>

  <form id="askForm">
    <div class="form-group">
      <label for="repoUrl">GitHub Repository URL</label>
      <div class="demo-buttons">
        <button type="button" class="demo-btn" onclick="setDemo('https://github.com/encode/starlette', 'Where does URL path routing and matching occur?')">Demo: Starlette</button>
        <button type="button" class="demo-btn" onclick="setDemo('https://github.com/tiangolo/fastapi', 'Where is the OpenAPI schema generation logic implemented?')">Demo: FastAPI</button>
        <button type="button" class="demo-btn" onclick="setDemo('https://github.com/pallets/flask', 'Where is the main Flask application object defined?')">Demo: Flask</button>
      </div>
      <input type="text" id="repoUrl" placeholder="https://github.com/encode/starlette" value="https://github.com/encode/starlette" required>
    </div>
    <div class="form-group">
      <label for="question">Question</label>
      <input type="text" id="question" placeholder="e.g., Where does URL routing happen?" value="Where does URL path routing and matching occur?" required>
    </div>
    <button type="submit" id="submitBtn">Analyze Repository</button>
  </form>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <div>Live Reasoning Steps <span id="spinner" class="spinner hidden"></span></div>
        <span id="stepCounter" class="meta-badge hidden">0 steps | 0.0s</span>
      </div>
      <div class="panel-body" id="stepsPanel">
        <div style="color: #999; font-style: italic;">Steps will appear here...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Final Result</div>
      <div class="panel-body result-content" id="resultPanel">
        <div style="color: #999; font-style: italic;">Result will appear here...</div>
      </div>
    </div>
  </div>

  <script>
    function setDemo(repo, q) {
      document.getElementById('repoUrl').value = repo;
      document.getElementById('question').value = q;
    }

    let timerInterval = null;
    let startTime = 0;
    let stepCount = 0;

    function updateCounter(elapsed) {
      document.getElementById('stepCounter').textContent = `${stepCount} steps | ${elapsed.toFixed(1)}s`;
    }

    // Configure Marked.js with syntax highlighting
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      }
    });

    document.getElementById('askForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const repoUrl = document.getElementById('repoUrl').value.trim();
      const question = document.getElementById('question').value.trim();
      if (!repoUrl || !question) return;

      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const stepsPanel = document.getElementById('stepsPanel');
      const resultPanel = document.getElementById('resultPanel');
      const stepCounter = document.getElementById('stepCounter');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      stepCounter.classList.remove('hidden');
      stepsPanel.innerHTML = '';
      resultPanel.innerHTML = '';
      
      stepCount = 0;
      startTime = Date.now();
      updateCounter(0);
      
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        updateCounter((Date.now() - startTime) / 1000);
      }, 100);

      try {
        const response = await fetch('/ask/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_url: repoUrl, question: question, top_n: 3 })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Keep incomplete line in buffer

          for (const line of lines) {
            if (!line.trim()) continue;
            
            try {
              const event = JSON.parse(line);
              
              if (event.type === 'step') {
                stepCount++;
                const el = document.createElement('div');
                el.className = 'step';
                el.innerHTML = `<span class="step-time">+${event.ts.toFixed(3)}s</span> ${event.message}`;
                stepsPanel.appendChild(el);
                stepsPanel.scrollTop = stepsPanel.scrollHeight;
              } 
              else if (event.type === 'result') {
                if (timerInterval) {
                  clearInterval(timerInterval);
                  timerInterval = null;
                }
                const data = event.data;
                updateCounter(data.elapsed_seconds);

                // Calculate confidence based on top search score
                let confLevel = "Low";
                let confClass = "conf-low";
                if (data.results.length > 0) {
                  const maxScore = data.results[0].score;
                  if (maxScore > 10.0) { confLevel = "High"; confClass = "conf-high"; }
                  else if (maxScore > 2.0) { confLevel = "Medium"; confClass = "conf-med"; }
                }
                
                let html = `
                  <div>
                    <h3>Analysis Complete</h3>
                    <span class="conf-badge ${confClass}">Confidence: ${confLevel}</span>
                  </div>
                  <p style="margin-top: 5px; color: #666; font-size: 13px;">
                     <strong>Repo:</strong> ${data.repo_url} &bull; 
                     <strong>Cached:</strong> ${data.cached ? 'Yes' : 'No'} &bull; 
                     <strong>Time:</strong> ${data.elapsed_seconds}s
                  </p>
                `;
                
                if (data.used_llm && data.llm_explanation) {
                  // Custom marked extension to linkify file paths
                  let parsedExp = data.llm_explanation;
                  
                  // Simple regex to find inline code blocks that look like file paths
                  // and wrap them in a GitHub link
                  const cleanRepo = data.repo_url.replace(/.git$/, '');
                  
                  parsedExp = parsedExp.replace(/\`([a-zA-Z0-9_\-\.\/]+)\`/g, (match, path) => {
                    // If it looks like a path (has a dot or slash, isn't a single word)
                    if (path.includes('/') || (path.includes('.') && !path.includes(' '))) {
                      return `<a href="${cleanRepo}/blob/master/${path}" target="_blank" style="text-decoration: none;"><code>${path}</code></a>`;
                    }
                    return match;
                  });

                  html += `<div class="llm-exp">${marked.parse(parsedExp)}</div>`;
                } else {
                  html += `<h4>Top Files Identified:</h4><ul>`;
                  for (const f of data.results) {
                    html += `<li><code>${f.file}</code> (Score: ${f.score})</li>`;
                  }
                  html += `</ul>`;
                }
                
                resultPanel.innerHTML = html;
              }
              else if (event.type === 'error') {
                if (timerInterval) clearInterval(timerInterval);
                resultPanel.innerHTML = `<div style="color: red;"><strong>Error:</strong> ${event.message}</div>`;
              }
            } catch (err) {
              console.error("Failed to parse JSON line:", line, err);
            }
          }
        }
      } catch (err) {
        if (timerInterval) clearInterval(timerInterval);
        resultPanel.innerHTML = `<div style="color: red;"><strong>Request Failed:</strong> ${err.message}</div>`;
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
        if (timerInterval) clearInterval(timerInterval);
      }
    });

  </script>
</body>
</html>
